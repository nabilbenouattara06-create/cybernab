
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact_cybernab</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <div class="nav_bar">
            <div class="logo"><img src="Cybersecurity header image.webp" alt="logo cybernab"></div>
            <div class="menu">
                <ul>
                    <li><a href="page_ouverture.html">Acceuil</a></li>
                    <li><a href="service.html">Services</a></li>
                    <li><a href="a_propos.html">A propos</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </header>
    <main>
        <div class="titre">
            <h1>NOS CONTACT</h1>
            <p>Une queston ? Nous apprecirons l'ecouter et y remedier</p>
        </div>
        <div class="formulaire">
            <div class="your_mail">
                <h3>votre message</h3>
                <p>nom</p>
                <input type="text" placeholder="votre nom">

                <p>e-mail</p>
                <input type="email" name="" id="" placeholder="votre adresse mail">

                <p>sujet</p>
                <input type="text" placeholder="sur quoi porte votre message ?">

                <p>message</p>
                <textarea name="" id="" rows="10" placeholder="entrez votre mesage"></textarea>
                 
                <button>envoyer</button>

            </div>
            <div class="contact_hours">
                <div class="contact">

                    <h3>contact et info</h3>
                   <img src="white-envelope-icon-with-transparent-background-png.webp" alt="img">
                   <p>cybernab@mail.com</p>

                   <img src="pngtree-phone-icon-in-circle-shape-png-image_18386322.webp" alt="img">
                   <p>0123456789</p>

                   <img src="10133991.png" alt="img">
                   <p>adresse/site </p>

                </div>
                <div class="hours">
                    <h3>disponibilité</h3>
                    <p>a remplir ulterieurement</p>
                </div>
            </div>

        </div>
    </main>

</body>
